<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Repayment</title>
    <link rel="icon" type="image/png" href="repayment-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: "#0a1628",
                            blue: "#1a3a6b",
                            mid: "#1e4d8c",
                            accent: "#2e6bce",
                            light: "#4a90e2",
                            gold: "#c9a84c",
                            goldlt: "#e6c96e",
                            offwhite: "#f4f6fa",
                            gray: "#8a9ab5",
                            border: "#d6dde8",
                        },
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', "serif"],
                        body: ['"DM Sans"', "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        .font-display { font-family: 'Playfair Display', serif; }
        .auth-bg {
            background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 100%);
            position: relative;
            overflow: hidden;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.05;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px border rgba(255, 255, 255, 0.1);
        }
        
        /* Entrance Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s ease forwards;
        }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-6">
    
    <div class="max-w-md w-full relative z-10 px-4 animate-fade-up">
        <!-- Logo -->
        <div class="text-center mb-10">
            <a href="index.html" class="inline-flex items-center gap-3 group">
                <img src="repayment-logo-white.png" alt="Repayment" class="h-12 w-auto group-hover:scale-105 transition-transform duration-300">
            </a>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] overflow-hidden border border-white/20">
            <div class="p-10 sm:p-12">
                <div class="mb-10 text-center sm:text-left">
                    <h1 class="font-display text-3xl font-bold text-brand-navy mb-3">Welcome Back</h1>
                    <p class="text-brand-gray text-sm leading-relaxed">Securely access your account to track your fund recovery progress.</p>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-brand-navy uppercase tracking-widest mb-2.5 ml-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-brand-gray">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            </span>
                            <input type="email" id="email" required placeholder="name@company.com" 
                                class="w-full pl-12 pr-5 py-4.5 rounded-2xl border border-brand-border bg-brand-offwhite focus:outline-none focus:ring-2 focus:ring-brand-accent focus:border-transparent transition-all placeholder:text-gray-400">
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-2.5 ml-1">
                            <label class="block text-xs font-bold text-brand-navy uppercase tracking-widest">Password</label>
                            <a href="#" class="text-xs font-bold text-brand-accent hover:text-brand-blue transition">Forgot?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-brand-gray">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </span>
                            <input type="password" id="password" required placeholder="••••••••" 
                                class="w-full pl-12 pr-12 py-4.5 rounded-2xl border border-brand-border bg-brand-offwhite focus:outline-none focus:ring-2 focus:ring-brand-accent focus:border-transparent transition-all placeholder:text-gray-400">
                            <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-brand-gray hover:text-brand-accent transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eye-icon">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 ml-1">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-brand-border text-brand-accent focus:ring-brand-accent">
                        <label for="remember" class="text-sm text-brand-gray font-medium">Keep me logged in</label>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full py-4 bg-brand-navy text-white font-bold rounded-xl hover:bg-brand-blue transform hover:-translate-y-0.5 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
                        Sign In
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-brand-border text-center">
                    <p class="text-brand-gray text-sm">
                        Don't have an account? 
                        <a href="register.html" class="font-bold text-brand-accent hover:underline">Create an account</a>
                    </p>
                </div>
            </div>
        </div>

        <p class="text-center text-white/50 text-xs mt-10">
            &copy; 2024 Repayment Ltd. All rights reserved. <br>
            Secure 256-bit SSL Encrypted Connection
        </p>
    </div>

    <!-- Toast Notification (Reuse from main site) -->
    <div id="toast" class="fixed bottom-10 right-10 z-50 max-w-xs opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-brand-navy text-white px-5 py-4 rounded-2xl shadow-2xl border border-brand-accent flex items-center gap-3">
            <div id="toast-icon" class="w-6 h-6 rounded-full flex items-center justify-center shrink-0">
                <!-- Icon injected by JS -->
            </div>
            <span id="toast-msg" class="text-sm font-medium"></span>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const submitBtn = document.getElementById('submit-btn');

        function togglePasswordVisibility(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.textContent = msg;
            
            if (type === 'success') {
                toastIcon.innerHTML = '<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
                toastIcon.className = 'w-6 h-6 rounded-full bg-green-500/10 flex items-center justify-center shrink-0';
            } else {
                toastIcon.innerHTML = '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
                toastIcon.className = 'w-6 h-6 rounded-full bg-red-500/10 flex items-center justify-center shrink-0';
            }

            toast.style.opacity = '1';
            toast.style.transform = 'translateY(-10px)';
            toast.style.pointerEvents = 'auto';

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(0)';
                toast.style.pointerEvents = 'none';
            }, 4000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Signing in...';

            const result = await window.auth.loginUser({ email, password });

            if (result.success) {
                showToast('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirect to home or dashboard
                }, 1500);
            } else {
                showToast(result.message || 'Login failed. Please check your credentials.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
            }
        });
    </script>
</body>
</html>
