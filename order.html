<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Service | Repayment</title>
    <link rel="icon" type="image/png" href="repayment-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: "#0a1628",
                blue: "#1a3a6b",
                mid: "#1e4d8c",
                accent: "#2e6bce",
                light: "#4a90e2",
                gold: "#c9a84c",
                goldlt: "#e6c96e",
                offwhite: "#f4f6fa",
                gray: "#8a9ab5",
                border: "#d6dde8",
              },
            },
            fontFamily: {
              display: ['"Playfair Display"', "serif"],
              body: ['"DM Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="antialiased bg-brand-offwhite">
    <!-- ======== COOKIE BAR ======== -->
    <div
      id="cookie-bar"
      class="fixed bottom-0 inset-x-0 z-50 px-6 py-3 flex flex-wrap items-center justify-between gap-3 text-sm bg-brand-navy"
    >
      <p class="text-blue-200">
        We use cookies —
        <a href="#" class="text-blue-300 underline">here's why.</a>
      </p>
      <button
        onclick="document.getElementById('cookie-bar').remove()"
        class="bg-brand-accent text-white px-4 py-1.5 rounded-full text-xs font-semibold hover:bg-brand-light transition"
      >
        OK
      </button>
    </div>

    <!-- ======== IMPOSTER WARNING ======== -->
    

    <div id="site-header"></div>

    <!-- ======== ORDER SECTION ======== -->
    <section class="section-off py-20 min-h-[70vh]">
      <div class="max-w-2xl mx-auto px-5">
        <div class="text-center mb-10 reveal visible">
          <p class="text-brand-accent text-sm font-semibold uppercase tracking-widest mb-3">
            Secure Checkout
          </p>
          <h2 class="font-display text-4xl font-bold text-brand-navy mb-4">
            Complete Your Order
          </h2>
          <p class="text-brand-gray" id="service-description">
            You are ordering a premium investigation report.
          </p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-brand-border overflow-hidden reveal visible">
            <div class="p-8 sm:p-10">
                <form id="order-form" class="space-y-6">
                    <div>
                        <label class="block text-xs font-bold text-brand-navy uppercase tracking-widest mb-2.5 ml-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-brand-gray">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                            </span>
                            <input type="email" id="email" required placeholder="name@company.com" 
                                class="w-full pl-12 pr-5 py-4.5 rounded-xl border border-brand-border bg-brand-offwhite focus:outline-none focus:ring-2 focus:ring-brand-accent focus:border-transparent transition-all placeholder:text-gray-400">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-brand-navy uppercase tracking-widest mb-2.5 ml-1">Phone Number</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-brand-gray">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                            </span>
                            <input type="tel" id="phone" required placeholder="+1 (555) 000-0000" 
                                class="w-full pl-12 pr-5 py-4.5 rounded-xl border border-brand-border bg-brand-offwhite focus:outline-none focus:ring-2 focus:ring-brand-accent focus:border-transparent transition-all placeholder:text-gray-400">
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full py-4 mt-4 btn-primary text-white font-bold rounded-xl transform hover:-translate-y-0.5 transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
                        Book Now
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                    
                    <div id="auth-warning" class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm text-center hidden mt-6">
                        You must be logged in to order. <a href="login.html" class="font-bold underline text-red-700">Log in here</a>
                    </div>
                </form>
            </div>
        </div>
      </div>
    </section>

    <!-- ======== FOOTER ======== -->
    <div id="site-footer"></div>

    <!-- ======== SUCCESS MODAL ======== -->
    <div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center p-5 hidden">
        <div class="absolute inset-0 bg-brand-navy/60 backdrop-blur-sm"></div>
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden max-w-sm w-full relative z-10 transform transition-all p-8 text-center animate-fade-up">
            <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-5 border-[6px] border-green-100">
                <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="font-display font-bold text-2xl text-brand-navy mb-2">Booking Successful</h3>
            <p class="text-brand-gray text-sm mb-8">Your order has been securely submitted. Our team will begin the evaluation immediately.</p>
            <button id="success-modal-ok" class="w-full btn-primary text-white font-bold py-3.5 rounded-xl transform hover:-translate-y-0.5 transition-all shadow-lg hover:shadow-xl">
                OK
            </button>
        </div>
    </div>

    <!-- ======== TOAST NOTIFICATION ======== -->
    <div
      id="toast"
      class="fixed bottom-20 right-5 z-50 max-w-xs opacity-0 transition-all duration-300 pointer-events-none"
    >
      <div
        class="bg-brand-navy text-white px-5 py-3.5 rounded-xl shadow-2xl border border-brand-accent flex items-center gap-3"
      >
        <div id="toast-icon">
            <svg
            class="w-5 h-5 text-green-400 shrink-0"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
            />
            </svg>
        </div>
        <span id="toast-msg" class="text-sm"></span>
      </div>
    </div>

    <!-- ======== SCRIPTS ======== -->
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Specific Order Page Logic
        const orderForm = document.getElementById('order-form');
        const submitBtn = document.getElementById('submit-btn');
        const authWarning = document.getElementById('auth-warning');
        const serviceDescription = document.getElementById('service-description');

        // Extract parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const packageId = urlParams.get('packageId') || '';
        const packageName = urlParams.get('packageName') || 'Unknown Package';

        if (packageName !== 'Unknown Package') {
            serviceDescription.innerHTML = `You are ordering the <strong class="text-brand-navy">${packageName}</strong> package.`;
        } else {
            // Also update the description if there is no package mapped (defensive check)
            serviceDescription.innerHTML = `Please select a package from our <a href="index.html#services" class="text-brand-accent underline">services page</a> to proceed.`;
        }

        // Get user info and check if they are authenticated
        let clientId = '';
        let caseId = '';
        const rawUserInfo = localStorage.getItem('user_info');
        
        if (rawUserInfo) {
            try {
                const user = JSON.parse(rawUserInfo);
                clientId = user.id || user._id || '';
                caseId = user.caseId || user.activeCase || '';
                
                // Pre-fill email and phone if available
                if (user.email) document.getElementById('email').value = user.email;
                if (user.phone) document.getElementById('phone').value = user.phone;
            } catch (e) {
                console.error('Failed to parse user_info');
            }
        }

        // Check auth status loosely
        if (!clientId && (!window.auth || !window.auth.isAuthenticated())) {
            authWarning.classList.remove('hidden');
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.textContent = msg;
            
            if (type === 'success') {
                toastIcon.innerHTML = '<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            } else {
                toastIcon.innerHTML = '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
            }

            toast.style.opacity = '1';
            toast.style.transform = 'translateY(-10px)';
            toast.style.pointerEvents = 'auto';

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(0)';
                toast.style.pointerEvents = 'none';
            }, 4000);
        }

        if (orderForm) {
            orderForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!packageId) {
                    showToast('Error: No package selected. Return to services page.', 'error');
                    return;
                }
                
                if (!clientId) {
                    console.warn("No clientId found in local storage. Order may fail.");
                }

                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;

                const orderData = {
                    packageId,
                    email,
                    phone
                };
                if (clientId) orderData.clientId = clientId;
                if (caseId) orderData.caseId = caseId;

                // Loading state
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Submitting...';

                const result = window.auth ? await window.auth.createOrder(orderData) : { success: false, message: 'Auth system not loaded' };

                if (result.success) {
                    const successModal = document.getElementById('success-modal');
                    const okBtn = document.getElementById('success-modal-ok');
                    
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Book Now <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
                    
                    // Show modal
                    successModal.classList.remove('hidden');
                    
                    // Handle OK click
                    okBtn.onclick = () => {
                        window.location.href = 'index.html'; // Redirect to home or dashboard
                    };
                } else {
                    showToast(result.message || 'Order failed. Please check your information.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Book Now <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
                }
            });
        }
      });
    </script>
  </body>
</html>
